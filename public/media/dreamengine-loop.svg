<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="deTitle deDesc">
  <title id="deTitle">DreamEngine loop</title>
  <desc id="deDesc">Diagram: one person steers five parallel agent lanes. A five-minute tick feeds a done-gate, then a merge train, with auto-resume, a status notifier, and a tool index.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8 5 L 0 8.8 Z" fill="#c4a35a"/>
    </marker>
  </defs>
  <rect width="1000" height="540" rx="12" fill="#161b16"/>
  <text x="32" y="42" fill="#e8e4d8" font-family="Georgia, 'Times New Roman', serif" font-size="22">DreamEngine loop</text>
  <text x="32" y="66" fill="#a8a49a" font-family="system-ui, sans-serif" font-size="13">One person steers. Parallel lanes build. A five-minute tick keeps the work moving.</text>

  <!-- Lead -->
  <rect x="40" y="100" width="200" height="64" rx="8" fill="#1e261e" stroke="#c4a35a" stroke-width="1.5"/>
  <text x="140" y="127" text-anchor="middle" fill="#e8e4d8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">You (the lead)</text>
  <text x="140" y="147" text-anchor="middle" fill="#a8a49a" font-family="system-ui, sans-serif" font-size="12">steer, decide, review</text>

  <line x1="240" y1="132" x2="310" y2="132" stroke="#c4a35a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Tick -->
  <rect x="318" y="100" width="200" height="64" rx="8" fill="#1e261e" stroke="#8a9a7a" stroke-width="1.5"/>
  <text x="418" y="127" text-anchor="middle" fill="#e8e4d8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Five-minute tick</text>
  <text x="418" y="147" text-anchor="middle" fill="#a8a49a" font-family="system-ui, sans-serif" font-size="12">scheduled loop</text>

  <line x1="518" y1="132" x2="588" y2="132" stroke="#c4a35a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Lanes box -->
  <rect x="596" y="88" width="364" height="88" rx="8" fill="#1e261e" stroke="#8a9a7a" stroke-width="1.5"/>
  <text x="778" y="110" text-anchor="middle" fill="#a8a49a" font-family="system-ui, sans-serif" font-size="11">Parallel agent lanes (local sessions)</text>
  <g font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e8e4d8">
    <rect x="612" y="122" width="62" height="36" rx="5" fill="#243024" stroke="#c4a35a"/>
    <text x="643" y="145" text-anchor="middle">HEALTH</text>
    <rect x="680" y="122" width="48" height="36" rx="5" fill="#243024" stroke="#c4a35a"/>
    <text x="704" y="145" text-anchor="middle">P6</text>
    <rect x="734" y="122" width="62" height="36" rx="5" fill="#243024" stroke="#c4a35a"/>
    <text x="765" y="145" text-anchor="middle">DREAM</text>
    <rect x="802" y="122" width="76" height="36" rx="5" fill="#243024" stroke="#c4a35a"/>
    <text x="840" y="145" text-anchor="middle">BOOKEND</text>
    <rect x="884" y="122" width="60" height="36" rx="5" fill="#243024" stroke="#c4a35a"/>
    <text x="914" y="145" text-anchor="middle">TETHER</text>
  </g>

  <!-- down from tick-lanes center to done-gate -->
  <line x1="500" y1="196" x2="500" y2="236" stroke="#c4a35a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- DONE-GATE -->
  <rect x="250" y="244" width="500" height="86" rx="8" fill="#1e261e" stroke="#c4a35a" stroke-width="1.5"/>
  <text x="500" y="272" text-anchor="middle" fill="#e8e4d8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Done-gate</text>
  <text x="500" y="296" text-anchor="middle" fill="#a8a49a" font-family="system-ui, sans-serif" font-size="13">A lane cannot be marked done until these pass:</text>
  <text x="500" y="316" text-anchor="middle" fill="#e8e4d8" font-family="system-ui, sans-serif" font-size="13">rebase  ·  rerun tests  ·  merge-ready check</text>

  <line x1="500" y1="330" x2="500" y2="368" stroke="#c4a35a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Merge train -->
  <rect x="340" y="376" width="320" height="56" rx="8" fill="#1e261e" stroke="#8a9a7a" stroke-width="1.5"/>
  <text x="500" y="400" text-anchor="middle" fill="#e8e4d8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Merge train</text>
  <text x="500" y="420" text-anchor="middle" fill="#a8a49a" font-family="system-ui, sans-serif" font-size="12">qualifying work lands one change at a time</text>

  <line x1="500" y1="432" x2="500" y2="466" stroke="#c4a35a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- support row -->
  <g font-family="system-ui, sans-serif">
    <rect x="80" y="474" width="260" height="44" rx="8" fill="#1e261e" stroke="#8a9a7a"/>
    <text x="210" y="501" text-anchor="middle" fill="#e8e4d8" font-size="13">Auto-resume stalled runs</text>
    <rect x="370" y="474" width="260" height="44" rx="8" fill="#1e261e" stroke="#8a9a7a"/>
    <text x="500" y="501" text-anchor="middle" fill="#e8e4d8" font-size="13">PC status notifier</text>
    <rect x="660" y="474" width="260" height="44" rx="8" fill="#1e261e" stroke="#8a9a7a"/>
    <text x="790" y="501" text-anchor="middle" fill="#e8e4d8" font-size="13">Tool index</text>
  </g>
</svg>
